name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release, ASan-UBSan, TSan]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
          - build_type: Debug
            cmake_build_type: Debug
            cmake_flags: ""
          - build_type: Release
            cmake_build_type: Release
            cmake_flags: ""
          - build_type: ASan-UBSan
            cmake_build_type: RelWithDebInfo
            cmake_flags: "-DMARKOV_CERO_ENABLE_ASAN_UBSAN=ON"
          - build_type: TSan
            cmake_build_type: RelWithDebInfo
            cmake_flags: "-DMARKOV_CERO_ENABLE_TSAN=ON"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The interpreter the package was qualified on (3.14.7);
          # the pinned pytest/numpy/pip and the cp314 wheel need >=3.12.
          python-version: "3.14.7"

      - name: Enforce source modularity
        run: python3 scripts/check_source_limits.py

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DMARKOV_CERO_WARNINGS_AS_ERRORS=ON \
            ${{ matrix.cmake_flags }}

      - name: Build targets
        run: cmake --build build --parallel 2

      - name: Run full CTest suite
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Run Netlib benchmark runner
        run: |
          python3 scripts/run_netlib.py \
            --solver build/markov-cero-solve \
            --instances afiro adlittle sc50a sc50b sc105 share2b recipe

      - name: Run MIPLIB benchmark runner
        env:
          # A Debug or sanitizer build slows the same search ~5x: flugpl's
          # gap-closing search crosses the 60 s default under Debug, ASan or
          # TSan (measured 5583-6703 of 12547 nodes at 60 s) while it finishes
          # in ~6 s in Release. The caps below are resource allowances for a
          # diagnostic build — a solve that proves optimality stops long before
          # them, only a stuck search is bounded — and the PASS bar (Optimal +
          # verified + relative tolerance) is unchanged for every job.
          MIPLIB_BUDGET: ${{ matrix.build_type != 'Release' && '--time-limit 600 --proof-time-limit 300 --timeout-sec 1200' || '' }}
        run: |
          python3 scripts/run_miplib.py \
            --solver build/markov-cero-solve \
            --instances stein9 stein15 flugpl \
            $MIPLIB_BUDGET

      - name: Run refinery qualification demo
        run: bash scripts/run-qualification-demo.sh
        env:
          MARKOV_CERO_BUILD_DIR: build

  cuda-build:
    name: CUDA compilation and CPU fallback
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04@sha256:392c0df7b577ecae17a17f6ba7f2009c217bb4422f8431c053ae9af61a8c148a
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ make git python3
          nvcc --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure actual CUDA compilation
        run: |
          cmake -S . -B build-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DMARKOV_CERO_ENABLE_CUDA=ON \
            -DMARKOV_CERO_WARNINGS_AS_ERRORS=ON
      - name: Build and confirm CUDA translation units
        run: |
          cmake --build build-cuda --parallel 2
          python3 -c "import json; c=json.load(open('build-cuda/compile_commands.json')); assert any(x['file'].endswith('.cu') and 'nvcc' in x['command'] for x in c)"
      - name: Run fallback checks (no GPU device on hosted runner)
        run: ctest --test-dir build-cuda -R 'gpu|equivalence' --output-on-failure --timeout 180

  ml-build:
    name: Optional ML compilation and fallback contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cmake -S . -B build-ml -DCMAKE_BUILD_TYPE=Release -DMARKOV_CERO_ENABLE_ML=ON -DMARKOV_CERO_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build-ml --parallel 2
      - run: ctest --test-dir build-ml -R 'ml_branching|strong_branching|mip_proof' --output-on-failure

  python-bindings:
    name: Python wheel and binding tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The interpreter the package was qualified on (3.14.7);
          # the pinned pytest/numpy/pip and the cp314 wheel need >=3.12.
          python-version: "3.14.7"
      - name: Verify license metadata is coherent
        run: |
          python3 - <<'EOF'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          assert project["license"] == "Apache-2.0", project["license"]
          assert "Apache License" in pathlib.Path("LICENSE").read_text()
          print("license metadata coherent:", project["license"])
          EOF
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip wheel . --no-deps -w dist
      - name: Install wheel and run binding tests
        run: |
          python -m pip install --no-deps dist/markov_cero-*.whl
          python -m pip install pytest==9.1.1 numpy==2.5.3
          python -m pytest python/tests -q

  docs-and-web:
    name: Documentation paths and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The interpreter the package was qualified on (3.14.7);
          # the pinned pytest/numpy/pip and the cp314 wheel need >=3.12.
          python-version: "3.14.7"
      - name: Check current documentation links
        run: python3 scripts/check_docs.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web app
        working-directory: web
        run: npm run build
